name: Winlator Android debug APK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: winlator-android-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    name: Build ARM64 debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out pinned source and nested submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install pinned Android native toolchains
        run: |
          yes | sdkmanager --licenses
          sdkmanager --install "ndk;24.0.8215888" "cmake;3.22.1"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Build upstream Winlator debug APK
        working-directory: upstream/winlator/app
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Upload ARM64 debug APK
        uses: actions/upload-artifact@v4
        with:
          name: winlator-11.2-arm64-debug
          path: upstream/winlator/app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
